[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mastcam-demosaic"
version = "0.1.0"
description = "De-mosaic (colorize) raw Bayer-pattern images from the Curiosity rover's MastCam"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "Pillow>=9.0",
]

[project.scripts]
mastcam-demosaic = "mastcam_demosaic.cli:main"

[tool.hatch.build.targets.sdist]
exclude = ["examples/"]
